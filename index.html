<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Tiquetario</title>
<meta name="description" content="Tickets de compra con lectura automática, categorías, estadísticas y presupuesto — todo en tu propio teléfono.">
<meta name="theme-color" content="#14b8a6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14131f" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tiquetario">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@22,400,0,0&display=swap">
<style>
  :root{
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --page:#f5f6fc; --backdrop:#e3e6f3;
    --surface:#ffffff; --surface-2:#f0f1fa;
    --ink:#2b2a3d; --ink-2:#69677e; --muted:#9c9ab0;
    --line:#e7e6f3; --line-strong:#d6d4e9;
    --accent:#14b8a6; --accent-ink:#ffffff; --accent-soft:#d8f5f0;
    --tax:#ff7a59; --tax-soft:#ffe7de;
    --good:#22c55e; --warning:#f5a524; --critical:#ef4444;
    --cat-0:#2a78d6; --cat-1:#eb6834; --cat-2:#1baf7a; --cat-3:#eda100;
    --cat-4:#e87ba4; --cat-5:#008300; --cat-6:#4a3aa7; --cat-7:#e34948; --cat-x:#898781;
    --shadow: 0 1px 2px rgba(43,42,61,.06), 0 8px 24px rgba(43,42,61,.10);
  }
  html{ height:100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body{ margin:0; padding:0; height:100%; font:14px -apple-system,BlinkMacSystemFont,sans-serif; }
  img{ max-width:100%; }
  [hidden]{ display:none!important; }
  *,*::before,*::after{ box-sizing:border-box; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --page:#14131f; --backdrop:#0b0a12;
      --surface:#1c1b2b; --surface-2:#242335;
      --ink:#f1f0fa; --ink-2:#b9b7cc; --muted:#84829b;
      --line:#302f45; --line-strong:#3d3c56;
      --accent:#2dd4c0; --accent-ink:#062420; --accent-soft:#12332e;
      --tax:#ff9478; --tax-soft:#3a241d;
      --good:#34d399; --warning:#fbbf24; --critical:#f87171;
      --cat-0:#3987e5; --cat-1:#d95926; --cat-2:#199e70; --cat-3:#c98500;
      --cat-4:#d55181; --cat-5:#008300; --cat-6:#9085e9; --cat-7:#e66767; --cat-x:#7e8b84;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page:#14131f; --backdrop:#0b0a12;
    --surface:#1c1b2b; --surface-2:#242335;
    --ink:#f1f0fa; --ink-2:#b9b7cc; --muted:#84829b;
    --line:#302f45; --line-strong:#3d3c56;
    --accent:#2dd4c0; --accent-ink:#062420; --accent-soft:#12332e;
    --tax:#ff9478; --tax-soft:#3a241d;
    --good:#34d399; --warning:#fbbf24; --critical:#f87171;
    --cat-0:#3987e5; --cat-1:#d95926; --cat-2:#199e70; --cat-3:#c98500;
    --cat-4:#d55181; --cat-5:#008300; --cat-6:#9085e9; --cat-7:#e66767; --cat-x:#7e8b84;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.45);
  }
  /* In-app theme override (Ajustes > Tema) — always wins over the platform theme via #app id specificity */
  #app[data-force-theme="light"]{
    color-scheme: light;
    --page:#f5f6fc; --backdrop:#e3e6f3;
    --surface:#ffffff; --surface-2:#f0f1fa;
    --ink:#2b2a3d; --ink-2:#69677e; --muted:#9c9ab0;
    --line:#e7e6f3; --line-strong:#d6d4e9;
    --accent:#14b8a6; --accent-ink:#ffffff; --accent-soft:#d8f5f0;
    --tax:#ff7a59; --tax-soft:#ffe7de;
    --good:#22c55e; --warning:#f5a524; --critical:#ef4444;
    --cat-0:#2a78d6; --cat-1:#eb6834; --cat-2:#1baf7a; --cat-3:#eda100;
    --cat-4:#e87ba4; --cat-5:#008300; --cat-6:#4a3aa7; --cat-7:#e34948; --cat-x:#898781;
    --shadow: 0 1px 2px rgba(43,42,61,.06), 0 8px 24px rgba(43,42,61,.10);
  }
  #app[data-force-theme="dark"]{
    color-scheme: dark;
    --page:#14131f; --backdrop:#0b0a12;
    --surface:#1c1b2b; --surface-2:#242335;
    --ink:#f1f0fa; --ink-2:#b9b7cc; --muted:#84829b;
    --line:#302f45; --line-strong:#3d3c56;
    --accent:#2dd4c0; --accent-ink:#062420; --accent-soft:#12332e;
    --tax:#ff9478; --tax-soft:#3a241d;
    --good:#34d399; --warning:#fbbf24; --critical:#f87171;
    --cat-0:#3987e5; --cat-1:#d95926; --cat-2:#199e70; --cat-3:#c98500;
    --cat-4:#d55181; --cat-5:#008300; --cat-6:#9085e9; --cat-7:#e66767; --cat-x:#7e8b84;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.45);
  }
  #app[data-force-theme="dark"] .toast{ background:var(--surface-2); color:var(--ink); border:1px solid var(--line); }
  #app[data-force-theme="light"] .toast{ background:var(--ink); color:var(--page); border:none; }

  *{box-sizing:border-box;}
  body{background:var(--backdrop);}
  body{
    background:var(--backdrop);
    background:
      radial-gradient(1200px 800px at 12% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%),
      radial-gradient(1000px 750px at 100% 110%, color-mix(in srgb, var(--tax) 9%, transparent), transparent 60%),
      var(--backdrop);
    background-attachment:fixed;
  }
  .msy{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:22px;line-height:1;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;vertical-align:middle;-webkit-font-smoothing:antialiased;}
  .msy.sm{font-size:18px;}
  .msy.lg{font-size:30px;}
  #app{
    font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:var(--page); /* respaldo por si el navegador no soporta color-mix() */
    background:
      radial-gradient(900px 560px at 10% -8%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 55%),
      radial-gradient(680px 520px at 106% 104%, color-mix(in srgb, var(--tax) 11%, transparent), transparent 55%),
      var(--page);
    height:100%; max-width:480px; margin:0 auto;
    display:flex; flex-direction:column; position:relative;
    overflow:hidden;
  }
  @media (min-width:560px){
    #app{height:92vh; margin-top:4vh; border-radius:26px; box-shadow:0 24px 70px rgba(0,0,0,.35); border:1px solid rgba(0,0,0,.08);}
  }
  h1,h2,h3{font-family:'Fraunces',Georgia,serif; margin:0; text-wrap:balance;}
  .num{font-family:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace; font-variant-numeric:tabular-nums;}
  button{font-family:inherit; color:inherit;}
  input,select,textarea{font-family:inherit; color:inherit; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:15px; width:100%;}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  label{font-size:12.5px; color:var(--ink-2); font-weight:500; display:block; margin-bottom:5px;}
  .field{margin-bottom:14px;}
  .row{display:flex; gap:10px;}
  .row > *{flex:1;}

  /* ---- topbar ---- */
  .topbar{flex:0 0 auto; padding:16px 18px 12px; border-bottom:1px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .topbar h1{font-size:21px; font-weight:700; color:var(--ink);}
  .topbar .sub{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .month-nav{display:flex; align-items:center; gap:2px;}
  .icon-btn{background:none; border:none; padding:8px; border-radius:100px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink-2);}
  .icon-btn:hover{background:var(--surface-2);}
  .icon-btn.accent{color:var(--accent);}

  /* ---- view root ---- */
  #view-root{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 16px 28px;}
  #view-root.noscroll{overflow:hidden;}

  /* ---- tabbar ---- */
  .tabbar{flex:0 0 auto; display:flex; background:var(--surface); border-top:1px solid var(--line);}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 4px 10px; background:none; border:none; color:var(--muted); font-size:11px; font-weight:500; cursor:pointer;}
  .tab.active{color:var(--accent);}

  /* ---- cards ---- */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow);}
  .card h2{font-size:15px; font-weight:600; font-family:'IBM Plex Sans',sans-serif; color:var(--ink-2); letter-spacing:.02em; text-transform:uppercase; margin-bottom:12px;}
  .stat-row{display:flex; gap:14px;}
  .stat{flex:1;}
  .stat .v{font-size:22px; font-weight:600;}
  .stat .l{font-size:12px; color:var(--muted); margin-top:2px;}

  /* ---- progress ---- */
  .progress-track{height:10px; border-radius:6px; background:var(--surface-2); overflow:hidden; display:flex;}
  .progress-fill{height:100%; border-radius:6px; transition:width .3s;}

  /* ---- ticket list ---- */
  .day-group{margin-bottom:6px;}
  .day-label{font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:16px 2px 8px;}
  .ticket-row{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:11px 12px; margin-bottom:8px; cursor:pointer; text-align:left; width:100%;}
  .ticket-row:active{background:var(--surface-2);}
  .tag-dot{width:11px; height:11px; border-radius:50%; flex:0 0 auto;}
  .ticket-thumb{width:38px; height:38px; border-radius:8px; object-fit:cover; flex:0 0 auto; border:1px solid var(--line);}
  .ticket-main{flex:1; min-width:0;}
  .ticket-main .m{font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ticket-main .t{font-size:12px; color:var(--muted); margin-top:1px;}
  .ticket-amt{text-align:right; flex:0 0 auto;}
  .ticket-amt .tot{font-weight:600; font-size:14.5px;}
  .ticket-amt .tax{font-size:11px; color:var(--tax); margin-top:1px;}

  .chip{display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:100px; font-size:12.5px; font-weight:500; background:var(--surface-2); border:1px solid var(--line); white-space:nowrap;}
  .chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
  .chip-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px;}
  .chip-row::-webkit-scrollbar{display:none;}

  .empty{text-align:center; padding:40px 20px; color:var(--muted);}
  .empty .msy{font-size:40px; opacity:.5; margin-bottom:10px;}
  .empty p{margin:6px 0 16px; font-size:14px;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 18px; border-radius:12px; border:none; font-weight:600; font-size:14.5px; cursor:pointer; width:100%;}
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-secondary{background:var(--surface-2); color:var(--ink); border:1px solid var(--line);}
  .btn-danger{background:var(--critical); color:#fff;}
  .btn-ghost{background:none; color:var(--accent); font-weight:600;}
  .btn-sm{padding:8px 12px; font-size:13px; width:auto;}
  .btn:disabled{opacity:.5; cursor:default;}
  .btn-stack{display:flex; flex-direction:column; gap:10px;}

  /* ---- scan view ---- */
  .scan-hero{border:1.5px dashed var(--line-strong); border-radius:18px; padding:26px 18px; text-align:center; background:var(--surface); margin-bottom:16px;}
  .scan-hero .msy{color:var(--accent);}
  .preview-wrap{position:relative; border-radius:16px; overflow:hidden; margin-bottom:14px; background:var(--surface-2); border:1px solid var(--line);}
  .preview-wrap img{width:100%; display:block; max-height:280px; object-fit:contain; background:var(--surface-2);}
  .analyzing{display:flex; flex-direction:column; align-items:center; gap:12px; padding:34px 18px; text-align:center;}
  .spin{animation:spin 1.1s linear infinite; color:var(--accent);}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ .spin{animation:none;} }
  .badge{display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:100px; font-size:11.5px; font-weight:600;}
  .badge.good{background:color-mix(in srgb, var(--good) 18%, transparent); color:var(--good);}
  .badge.warn{background:color-mix(in srgb, var(--warning) 20%, transparent); color:var(--warning);}
  .badge.crit{background:color-mix(in srgb, var(--critical) 18%, transparent); color:var(--critical);}
  .notice{display:flex; gap:10px; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:12px 13px; font-size:13px; color:var(--ink-2); margin-bottom:14px;}
  .notice.tax{background:var(--tax-soft); color:var(--tax); border-color:transparent;}
  .notice.warn{color:var(--warning); border-color:var(--warning);}
  .notice .msy{flex:0 0 auto; margin-top:1px;}

  .receipt-total{border-top:2px dashed var(--line-strong); margin-top:8px; padding-top:10px; display:flex; justify-content:space-between; font-weight:700; font-size:16px;}
  .kv{display:flex; justify-content:space-between; padding:6px 0; font-size:14px;}
  .kv .l{color:var(--ink-2);}

  /* ---- bar rows (stats) ---- */
  .bar-row{margin-bottom:12px;}
  .bar-row .hd{display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px;}
  .bar-row .hd .name{display:flex; align-items:center; gap:7px; font-weight:500;}
  .bar-track{height:10px; border-radius:5px; background:var(--surface-2); overflow:hidden;}
  .bar-fill{height:100%; border-radius:5px;}

  .trend-chart{display:flex; align-items:flex-end; gap:8px; height:130px; padding-top:20px; position:relative;}
  .trend-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px;}
  .trend-bar{width:100%; max-width:30px; border-radius:5px 5px 2px 2px; background:var(--accent);}
  .trend-val{font-size:10.5px; color:var(--ink-2);}
  .trend-lbl{font-size:11px; color:var(--muted); margin-top:2px;}
  .trend-grid{position:absolute; inset:20px 0 0 0; pointer-events:none;}
  .trend-grid div{position:absolute; left:0; right:0; border-top:1px solid var(--line);}

  .split-bar{height:22px; border-radius:8px; overflow:hidden; display:flex; margin-bottom:10px;}
  .split-legend{display:flex; gap:16px; font-size:12.5px;}
  .split-legend .item{display:flex; align-items:center; gap:6px;}
  .swatch{width:10px; height:10px; border-radius:3px; flex:0 0 auto;}

  table.stat-table{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.stat-table th{text-align:left; color:var(--muted); font-weight:500; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; padding-bottom:8px; border-bottom:1px solid var(--line);}
  table.stat-table td{padding:8px 0; border-bottom:1px solid var(--line);}
  table.stat-table td.num, table.stat-table th.num{text-align:right;}

  /* ---- settings ---- */
  .setting-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 2px; border-bottom:1px solid var(--line);}
  .setting-row:last-child{border-bottom:none;}
  .tag-item{display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--line);}
  .tag-item:last-child{border-bottom:none;}
  .tag-item .name{flex:1; font-size:14.5px; font-weight:500;}

  /* ---- modal ---- */
  .modal-backdrop{position:absolute; inset:0; background:rgba(10,15,12,.5); display:flex; align-items:flex-end; z-index:40;}
  @media (min-width:560px){ .modal-backdrop{align-items:center; justify-content:center;} }
  .modal-sheet{background:var(--page); width:100%; max-height:92%; overflow-y:auto; border-radius:20px 20px 0 0; padding:18px 18px 26px;}
  @media (min-width:560px){ .modal-sheet{border-radius:20px; max-width:420px; max-height:85%;} }
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .modal-head h2{font-size:18px; font-weight:700; text-transform:none; letter-spacing:0; color:var(--ink);}

  .toast{position:absolute; left:50%; bottom:78px; transform:translateX(-50%); background:var(--ink); color:var(--page); padding:10px 18px; border-radius:100px; font-size:13.5px; font-weight:500; box-shadow:var(--shadow); z-index:60; white-space:nowrap;}
  :root:not([data-theme="light"]) .toast{background:var(--surface-2); color:var(--ink); border:1px solid var(--line);}
  :root[data-theme="dark"] .toast{background:var(--surface-2); color:var(--ink); border:1px solid var(--line);}

  .item-line{display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0; border-bottom:1px solid var(--line);}
  .item-line:last-child{border-bottom:none;}
  .photo-full{width:100%; border-radius:14px; margin-bottom:14px; border:1px solid var(--line);}
  .items-details{margin-bottom:14px; border:1px solid var(--line); border-radius:12px; padding:2px 14px; background:var(--surface-2);}
  .items-details summary{padding:10px 0; font-size:13.5px; font-weight:600; color:var(--ink-2); cursor:pointer; list-style:none;}
  .items-details summary::-webkit-details-marker{display:none;}
  .items-details summary::after{content:'expand_more'; font-family:'Material Symbols Outlined'; float:right; font-size:20px; color:var(--muted);}
  .items-details[open] summary::after{content:'expand_less';}
  .items-details-list{padding-bottom:10px;}
  [hidden]{display:none!important;}
</style>
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar"></header>
  <main id="view-root"></main>
  <nav class="tabbar" id="tabbar">
    <button class="tab" data-action="tab" data-view="tickets"><span class="msy">receipt_long</span>Tickets</button>
    <button class="tab" data-action="tab" data-view="scan"><span class="msy">photo_camera</span>Escanear</button>
    <button class="tab" data-action="tab" data-view="stats"><span class="msy">bar_chart</span>Estadísticas</button>
    <button class="tab" data-action="tab" data-view="settings"><span class="msy">settings</span>Ajustes</button>
  </nav>
  <div id="modal-root"></div>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
/* ================= Constants ================= */
const DEFAULT_TAGS = [
  {id:'supermercado', name:'Supermercado', slot:0, icon:'shopping_cart'},
  {id:'restauracion', name:'Restauración', slot:1, icon:'restaurant'},
  {id:'transporte', name:'Transporte', slot:2, icon:'directions_bus'},
  {id:'ocio', name:'Ocio', slot:3, icon:'celebration'},
  {id:'salud', name:'Salud', slot:4, icon:'medical_services'},
  {id:'hogar', name:'Hogar', slot:5, icon:'home'},
  {id:'ropa', name:'Ropa', slot:6, icon:'checkroom'},
  {id:'otros', name:'Otros', slot:7, icon:'category'},
];

/* ================= State ================= */
const STATE = {
  view: 'tickets',
  tickets: [],
  tags: [],
  budget: 0,
  currentMonth: monthKey(new Date()),
  ocrAvailable: true,
  fileAccept: 'image/*',
  scan: { stage:'idle', file:null, previewUrl:null, result:null, error:null, progress:0 },
  ticketFilter: { tag:null },
  theme: 'system',
  statsRange: 'month',
  statsTableView: false,
  statsProductView: 'count',
  statsFilter: { product:null, merchant:null },
  pendingConfirm: null,
  ready: false,
};
let currentOcrWorker = null;
let ocrCancelled = false;

/* ================= Utils ================= */
function pad(n){ return String(n).padStart(2,'0'); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function monthKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
function shiftMonth(key, delta){ const [y,m]=key.split('-').map(Number); const d=new Date(y,m-1+delta,1); return monthKey(d); }
function monthLabel(key){ const [y,m]=key.split('-').map(Number); const d=new Date(y,m-1,1); let s=d.toLocaleDateString('es-ES',{month:'long',year:'numeric'}); return s.charAt(0).toUpperCase()+s.slice(1); }
function monthShort(key){ const [y,m]=key.split('-').map(Number); let s=new Date(y,m-1,1).toLocaleDateString('es-ES',{month:'short'}); return s.replace('.','').replace(/^./,c=>c.toUpperCase()); }
function shiftDate(dateStr, delta){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+delta); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function genId(prefix){ return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
function fixed2(n){ return (Number(n)||0).toFixed(2); }
function money(n){ try{ return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(Number(n)||0);}catch(e){ return (Number(n)||0).toFixed(2)+' €'; } }
function escapeHtml(str){ return String(str??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function tagColor(tag){ return (tag && tag.slot!=null) ? `var(--cat-${tag.slot})` : 'var(--cat-x)'; }
const CAT_HEX = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'];
function catHex(tag){ return (tag && tag.slot!=null) ? CAT_HEX[tag.slot] : '#898781'; }
function computeCutoffDate(amount, unit){
  const d = new Date();
  if(unit==='days') d.setDate(d.getDate()-amount);
  else if(unit==='years') d.setFullYear(d.getFullYear()-amount);
  else d.setMonth(d.getMonth()-amount);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function csvCell(v){ v=String(v??''); if(/[";\n]/.test(v)) v='"'+v.replace(/"/g,'""')+'"'; return v; }

/* ================= IndexedDB ================= */
const DB_NAME='tiquetario_db', DB_VERSION=1;
let dbPromise=null;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('tickets')) db.createObjectStore('tickets',{keyPath:'id'});
      if(!db.objectStoreNames.contains('tags')) db.createObjectStore('tags',{keyPath:'id'});
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta',{keyPath:'key'});
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
function getDB(){ if(!dbPromise) dbPromise = openDB().catch(e=>{ dbPromise=null; throw e; }); return dbPromise; }
async function idbAll(store){
  const db = await getDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess=()=>resolve(req.result||[]);
    req.onerror=()=>reject(req.error);
  });
}
async function idbGet(store,key){
  const db = await getDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function idbPut(store,val){
  const db = await getDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).put(val);
    tx.oncomplete=()=>resolve(val);
    tx.onerror=()=>reject(tx.error);
  });
}
async function idbDelete(store,key){
  const db = await getDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}

/* ================= Boot ================= */
async function boot(){
  try{ STATE.tags = await idbAll('tags'); }catch(e){ STATE.tags=[]; }
  if(!STATE.tags.length){
    STATE.tags = DEFAULT_TAGS.map(t=>({...t}));
    for(const t of STATE.tags){ try{ await idbPut('tags', t); }catch(e){} }
  }
  try{
    STATE.tickets = (await idbAll('tickets')).sort((a,b)=> (b.date+b.createdAt).localeCompare(a.date+a.createdAt));
  }catch(e){ STATE.tickets=[]; }
  try{ const b = await idbGet('meta','budget'); STATE.budget = b ? Number(b.value)||0 : 0; }catch(e){}
  try{ const th = await idbGet('meta','theme'); STATE.theme = th && ['system','light','dark'].includes(th.value) ? th.value : 'system'; }catch(e){}
  applyTheme();
  STATE.ready = true;
  STATE.ocrAvailable = true;
  STATE.fileAccept = 'image/*';
  renderApp();
}
function applyTheme(){
  const app = document.getElementById('app');
  if(!app) return;
  if(STATE.theme==='system') app.removeAttribute('data-force-theme');
  else app.setAttribute('data-force-theme', STATE.theme);
}
async function setTheme(t){
  STATE.theme = t;
  applyTheme();
  try{ await idbPut('meta', {key:'theme', value:t}); }catch(e){}
  renderApp();
}
/* ================= Lazy library loading (offline-friendly: cached by the service worker after first use) ================= */
const LIB_URLS = {
  tesseract: 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js',
  jspdf: 'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js',
};
const _libPromises = {};
function loadScriptOnce(key){
  if(_libPromises[key]) return _libPromises[key];
  _libPromises[key] = new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = LIB_URLS[key];
    s.onload = ()=>resolve(true);
    s.onerror = ()=>{ delete _libPromises[key]; reject(new Error('No se pudo cargar '+key)); };
    document.head.appendChild(s);
  });
  return _libPromises[key];
}

/* ================= Tickets view ================= */
function ticketsThisMonth(){ return STATE.tickets.filter(t=>t.date && t.date.slice(0,7)===STATE.currentMonth); }
function filteredTickets(){
  let list = ticketsThisMonth();
  if(STATE.ticketFilter.tag) list = list.filter(t=>t.tag===STATE.ticketFilter.tag);
  return list;
}
function groupByDay(list){
  const map = new Map();
  for(const t of list){ if(!map.has(t.date)) map.set(t.date, []); map.get(t.date).push(t); }
  return Array.from(map.entries());
}
function dayLabel(dateStr){
  const today = todayStr();
  if(dateStr===today) return 'Hoy';
  if(dateStr===shiftDate(today,-1)) return 'Ayer';
  const d = new Date(dateStr+'T00:00:00');
  let s = d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function renderBudgetCard(total){
  let inner = `<div class="stat-row"><div class="stat"><div class="v num">${money(total)}</div><div class="l">Gastado este mes</div></div>`;
  if(STATE.budget>0){
    const remaining = STATE.budget-total;
    inner += `<div class="stat" style="text-align:right;"><div class="v num" style="color:${remaining<0?'var(--critical)':'var(--ink)'}">${money(remaining)}</div><div class="l">${remaining<0?'Por encima del presupuesto':'Disponible'}</div></div>`;
  }
  inner += `</div>`;
  if(STATE.budget>0){
    const pct = Math.min(100, total/STATE.budget*100);
    const color = total>STATE.budget ? 'var(--critical)' : (pct>80 ? 'var(--warning)' : 'var(--good)');
    inner += `<div class="progress-track" style="margin-top:12px;"><div class="progress-fill" style="width:${pct}%;background:${color};"></div></div>`;
  } else {
    inner += `<div class="notice" style="margin-top:12px;margin-bottom:0;"><span class="msy sm">info</span>Define un presupuesto mensual en Ajustes para ver cuánto te queda.</div>`;
  }
  return `<div class="card">${inner}</div>`;
}
function renderTicketRow(t){
  const tag = STATE.tags.find(x=>x.id===t.tag);
  return `<button class="ticket-row" data-action="open-ticket" data-id="${t.id}">
    ${t.photo?`<img class="ticket-thumb" src="${t.photo}" alt="">`:`<span class="tag-dot" style="background:${tagColor(tag)};width:14px;height:14px;"></span>`}
    <div class="ticket-main">
      <div class="m">${escapeHtml(t.merchant||'Sin nombre')}</div>
      <div class="t">${tag?escapeHtml(tag.name):'Sin categoría'}</div>
    </div>
    <div class="ticket-amt">
      <div class="tot num">${money(t.total)}</div>
      <div class="tax num">IVA ${money(t.taxAmount)}</div>
    </div>
  </button>`;
}
function renderTickets(){
  const monthTickets = ticketsThisMonth();
  const total = monthTickets.reduce((s,t)=>s+Number(t.total||0),0);
  const list = filteredTickets();
  let html = renderBudgetCard(total);
  html += `<div class="chip-row"><button class="chip ${!STATE.ticketFilter.tag?'on':''}" data-action="filter-tag" data-id="">Todas</button>`;
  for(const t of STATE.tags){
    html += `<button class="chip ${STATE.ticketFilter.tag===t.id?'on':''}" data-action="filter-tag" data-id="${t.id}"><span class="tag-dot" style="background:${tagColor(t)};width:8px;height:8px;"></span>${escapeHtml(t.name)}</button>`;
  }
  html += `</div>`;
  if(!list.length){
    html += `<div class="empty"><span class="msy lg">receipt_long</span><p>${monthTickets.length? 'No hay tickets con ese filtro.' : 'Aún no tienes tickets este mes.'}</p>
      ${monthTickets.length?'':'<button class="btn btn-primary" data-action="tab" data-view="scan" style="width:auto;padding-left:22px;padding-right:22px;">Añadir el primero</button>'}</div>`;
  } else {
    for(const [day, items] of groupByDay(list)){
      html += `<div class="day-label">${dayLabel(day)}</div>`;
      for(const t of items) html += renderTicketRow(t);
    }
  }
  return html;
}

/* ---- Lectura local del ticket (OCR en el propio navegador, sin servidores) ---- */
function parseEsNumber(str){
  if(str==null) return NaN;
  str = String(str).trim();
  const hasComma = str.includes(','), hasDot = str.includes('.');
  if(hasComma && hasDot) str = str.replace(/\./g,'').replace(',', '.');
  else if(hasComma) str = str.replace(',', '.');
  return parseFloat(str);
}
const MERCHANT_HINTS = [
  [/mercadona|carrefour|\blidl\b|\bdia\b|alcampo|eroski|consum|ahorramas|\baldi\b|el corte ingl/i, 'supermercado'],
  [/restaurante|\bbar\b|cafeter|cerveceri|marisqueri|pizzeri|burger|kebab|bocateri/i, 'restauracion'],
  [/farmacia/i, 'salud'],
  [/gasolinera|repsol|cepsa|\bshell\b|estacion de servicio|parking|renfe|\bmetro\b|\btaxi\b|uber|cabify|autobus/i, 'transporte'],
  [/\bcine\b|teatro|museo|concierto|videojueg/i, 'ocio'],
  [/leroy merlin|\bikea\b|bricomart|ferreteria|bricodepot/i, 'hogar'],
  [/\bzara\b|primark|\bh&m\b|\bmango\b|decathlon|pull&bear|bershka/i, 'ropa'],
];
function guessTag(text){
  for(const [re, id] of MERCHANT_HINTS){
    if(re.test(text)){ const t = STATE.tags.find(x=>x.id===id); if(t) return t; }
  }
  return STATE.tags.find(t=>t.id==='otros') || STATE.tags[0] || null;
}
function parseReceiptText(text){
  text = text || '';
  const rawLines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const found = { total:null, base:null, iva:null, ivaPct:null, date:null, merchant:'' };
  // Líneas de "ruido": el lector de texto a veces alucina caracteres o palabras sueltas
  // imposibles en un ticket real (llaves, barras, acentos circunflejos, un paréntesis suelto sin
  // su pareja...) cuando la foto está borrosa, mal iluminada o tiene reflejos. Estas líneas se
  // descartan por completo (ni como importe, ni como producto), para que un número inventado en
  // una línea basura no termine siendo el total o un producto falso.
  const NOISE_CHARS_RE = /[{}|\\~^]/;
  function isNoiseLine(line){
    if(NOISE_CHARS_RE.test(line)) return true;
    // Un paréntesis de apertura o cierre sin su pareja en la misma línea es casi siempre ruido
    // del lector (p.ej. "Jota) 77"), mientras que un producto real con paréntesis los trae
    // siempre en pareja (p.ej. "GALLETAS (250G)").
    let open = 0;
    for(const ch of line){ if(ch==='(') open++; else if(ch===')') open--; if(open<0) return true; }
    return open!==0;
  }

  for(const line of rawLines.slice(0,6)){
    if(/[a-zA-ZÀ-ÿ]{3,}/.test(line) && !/^www\.|^cif|^nif|^tel[eé]fono/i.test(line)){
      found.merchant = line.replace(/[^\wÀ-ÿ\s.,&-]/g,'').trim().slice(0,60);
      break;
    }
  }
  const dateMatch = text.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(dateMatch){
    let [, d, m, y] = dateMatch;
    if(y.length===2) y = (Number(y)>50 ? '19':'20')+y;
    const dt = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(!isNaN(new Date(dt).getTime())) found.date = dt;
  }

  // TOTAL: only lines that actually say "total" as the grand total — never a payment method,
  // item count, discount line or tax-only line, which also often contain the word "total".
  const EXCLUDE_TOTAL_LINE = /subtotal|art[ií]culo|entrega|efectivo|cambio|vuelto|tarjeta|recib|descuento|\biva\b/i;
  const totalCandidates = [];
  for(let i=0;i<rawLines.length;i++){
    const line = rawLines[i];
    if(!/total/i.test(line) || EXCLUDE_TOTAL_LINE.test(line)) continue;
    let m = line.match(/total[^\d]{0,12}(\d{1,4}[.,]\d{2})/i);
    if(!m && rawLines[i+1]) m = rawLines[i+1].match(/^(\d{1,4}[.,]\d{2})$/);
    if(m) totalCandidates.push(parseEsNumber(m[1]));
  }
  if(totalCandidates.length) found.total = totalCandidates[totalCandidates.length-1];
  // Se guarda si el total vino de una línea "TOTAL" reconocida de verdad, o si hubo que adivinarlo
  // (el importe más alto entre las líneas limpias) porque esa línea no se pudo leer — para avisar
  // en el formulario de que conviene revisar el total a mano en ese segundo caso.
  const totalEstimated = totalCandidates.length===0;

  // Per-rate VAT summary table — the usual way Spanish supermarket/shop receipts break down
  // tax (a row per VAT band: letter/percentage, taxable base, tax amount), e.g. "A 4,00% 38,46 1,54".
  // Reading this table (when present) is far more accurate than assuming a single flat rate,
  // since a grocery basket usually mixes several VAT rates (4% / 10% / 21%) in one ticket.
  let tableBase = 0, tableIva = 0, tableRows = 0;
  const vatRowRe = /^[A-E]?\s*(\d{1,2}(?:[.,]\d{1,2})?)\s?%\s+(\d{1,4}[.,]\d{2})\s+(\d{1,4}[.,]\d{2})\b/;
  for(const line of rawLines){
    const m = line.match(vatRowRe);
    if(m){
      const n1 = parseEsNumber(m[2]), n2 = parseEsNumber(m[3]);
      // Las dos cifras de cada fila son la base imponible y la cuota de IVA, pero el orden de
      // las columnas varía según el ticket: unos imprimen "BASE CUOTA" y otros "IVA / P.NETO"
      // (p.ej. LIDL: "IVA% IVA + P N = PVP", cuota antes que base). Para cualquier tipo de IVA
      // real (4%–21%) la cuota siempre es menor que la base, así que asignamos la cifra mayor a
      // la base y la menor a la cuota, sin depender de en qué columna venga cada una.
      tableBase += Math.max(n1,n2);
      tableIva += Math.min(n1,n2);
      tableRows++;
    }
  }

  const baseMatch = text.match(/base\s*(imponible)?[^\d]{0,12}(\d{1,4}[.,]\d{2})/i);
  const ivaLineMatch = text.match(/iva[^\d%]{0,10}(\d{1,2}(?:[.,]\d{1,2})?)\s?%[^\d]{0,15}(\d{1,4}[.,]\d{2})?/i);
  const ivaAmtMatch = !ivaLineMatch ? text.match(/iva[^\d]{0,12}(\d{1,4}[.,]\d{2})/i) : null;

  if(tableRows>=1){
    found.base = +tableBase.toFixed(2);
    found.iva = +tableIva.toFixed(2);
  } else if(baseMatch){
    found.base = parseEsNumber(baseMatch[2]);
  }
  if(ivaLineMatch){
    found.ivaPct = Number(String(ivaLineMatch[1]).replace(',','.'));
    if(ivaLineMatch[2] && tableRows<1) found.iva = parseEsNumber(ivaLineMatch[2]);
  } else if(ivaAmtMatch && tableRows<1){
    found.iva = parseEsNumber(ivaAmtMatch[1]);
  }

  if(found.total==null){
    // Último recurso: si no se encontró una línea "TOTAL" reconocible, se toma el importe más
    // alto del ticket — pero solo de líneas limpias, nunca de una línea de ruido del lector de
    // texto (ver isNoiseLine), para que un número alucinado no se cuele como si fuera el total.
    const allNums = [];
    for(const line of rawLines){
      if(isNoiseLine(line)) continue;
      const nums = line.match(/\d{1,4}[.,]\d{2}/g);
      if(nums) for(const n of nums){ const v = parseEsNumber(n); if(!isNaN(v)) allNums.push(v); }
    }
    if(allNums.length) found.total = Math.max(...allNums);
  }

  let total = (found.total!=null && !isNaN(found.total)) ? found.total : 0;
  let base = (found.base!=null && !isNaN(found.base)) ? found.base : null;
  let iva = (found.iva!=null && !isNaN(found.iva)) ? found.iva : null;
  const taxDetected = base!=null || iva!=null;
  if(base==null && iva!=null){
    base = +(total-iva).toFixed(2);
  } else if(iva==null && base!=null){
    iva = +(total-base).toFixed(2);
  } else if(base==null && iva==null){
    // El ticket no mostraba ningún desglose de impuestos legible (ni tabla por tipo de IVA
    // ni una línea "BASE/IVA"). Muchos tickets de supermercado mezclan varios tipos de IVA
    // en la misma compra, así que adivinar un único porcentaje sería más probable que
    // estuviera mal que bien: se deja el importe completo como base, sin impuesto, y se
    // avisa en el formulario para que se ajuste a mano si se conoce el desglose real.
    base = total; iva = 0;
  }
  if(base<0) base = 0;
  if(iva<0) iva = 0;
  if(total===0 && (base>0 || iva>0)) total = +(base+iva).toFixed(2);

  // Líneas de producto: "NOMBRE DEL PRODUCTO   2,25 B" — la letra final (cuando aparece) es la
  // clase de IVA que muchos tickets de supermercado imprimen en cada línea, no parte del nombre.
  // Se excluyen líneas de cabecera/pie, descuentos (importe negativo), y líneas de peso/precio
  // por kg ("0,503 kg x 7,85 EUR/kg") y las propias filas de la tabla de IVA (llevan un "%").
  const NON_ITEM_LINE = /subtotal|total|entrega|efectivo|cambio|vuelto|tarjeta|recib|art[ií]culo|^desc\.?\b|descuento|\biva\b|^suma\b|base\s*imponible|^cif|^nif|^tel[eé]fono|^www\.|^https?:|eur\s*\/\s*(kg|ud|l|g)\b|^\d+([.,]\d+)?\s*(kg|g|l|ud|uds)\b/i;
  const ITEM_LINE_RE = /^(.{2,60}?)\s+(-?\d{1,4}[.,]\d{2})\s*[A-E]?$/;
  const items = [];
  for(const line of rawLines){
    if(NON_ITEM_LINE.test(line) || /%/.test(line) || isNoiseLine(line)) continue;
    const m = line.match(ITEM_LINE_RE);
    if(!m) continue;
    const price = parseEsNumber(m[2]);
    if(isNaN(price) || price<=0) continue;
    let name = m[1].replace(/\.{2,}/g,' ').replace(/\s{2,}/g,' ').trim();
    // Algunas líneas traen cantidad y precio unitario antes del importe final, p.ej.
    // "COCA COLA 2 x 1,25" con el total (2,50) ya capturado por el regex de arriba —
    // se separa esa cantidad del nombre en vez de dejarla colada como texto.
    let cantidad = 1;
    const qtyMatch = name.match(/^(.*\S)\s+(\d{1,3})\s*[xX]\s*\d{1,4}[.,]\d{2}$/);
    if(qtyMatch && qtyMatch[1].trim()){
      const q = parseInt(qtyMatch[2],10);
      if(q>0 && q<100){ name = qtyMatch[1].trim(); cantidad = q; }
    }
    // Un nombre válido de producto trae al menos un par de letras seguidas; descarta
    // restos numéricos/símbolos sueltos que el regex de arriba pudo capturar como "nombre"
    // en líneas ruidosas (p.ej. una fila de importes sin texto real).
    if(!name || !/[a-zA-ZÀ-ÿ]{2,}/.test(name)) continue;
    items.push({ nombre: name.slice(0,60), cantidad, precio_total: price });
    if(items.length>=60) break;
  }

  const foundCount = [found.total!=null, taxDetected, found.date!=null, !!found.merchant].filter(Boolean).length;
  const confianza = foundCount>=4 ? 'alta' : foundCount>=2 ? 'media' : 'baja';
  const tag = guessTag(text);

  return {
    comercio: found.merchant || '', fecha: found.date || todayStr(), items,
    base_imponible: base, impuesto: iva,
    tipo_impuesto_pct: found.ivaPct!=null ? found.ivaPct : null,
    total, categoria_id: tag ? tag.id : null,
    confianza, _taxEstimated: !taxDetected, _totalEstimated: totalEstimated, _fromAI: false,
  };
}
async function loadOrientedImage(file){
  // Camera photos — iPhones especially — carry an EXIF orientation tag (e.g. "rotate 90°",
  // set because the sensor itself is landscape and the phone just flags how to display it
  // upright). Browsers are NOT consistent about auto-rotating those pixels when the photo is
  // drawn onto a <canvas> via a plain <img> element: on some engines the canvas ends up with
  // the raw, sideways/upside-down sensor data even though the photo looks upright in the OS's
  // photo picker. Tesseract has no idea the text is rotated — it just reads garbage. This is
  // the main reason OCR quality can be far worse on iOS/Safari than on Android/Chrome for the
  // exact same photo. createImageBitmap with imageOrientation:'from-image' asks the browser to
  // decode the pixels already corrected, the same way on every platform; we fall back to the
  // older <img> path (uncorrected) only if that API isn't available at all.
  if(typeof createImageBitmap === 'function'){
    try{
      const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
      return { source: bmp, w: bmp.width, h: bmp.height, close: ()=>{ try{ bmp.close(); }catch(e){} } };
    }catch(e){ /* unsupported combination of options/format — fall through */ }
  }
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=> resolve({ source: img, w: img.naturalWidth||1, h: img.naturalHeight||1, close: ()=>URL.revokeObjectURL(url) });
    img.onerror = (e)=>{ URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}
async function preprocessForOcr(file){
  // Grayscale + contrast stretch + normalize resolution before handing the photo to
  // Tesseract. Phone photos of receipts are often low-contrast (thermal paper, uneven
  // lighting), and this simple pass measurably helps character recognition, especially
  // for digits. Normalizing width (not just upscaling) also matters because a live camera
  // shot can be 3000-4000px wide — much larger than Tesseract needs — while a picture
  // picked from the gallery is often already resized by the OS; feeding both through the
  // same target width keeps accuracy and processing time consistent either way.
  const { source, w: ow, h: oh, close } = await loadOrientedImage(file);
  try{
    let w = ow||1, h = oh||1;
    const targetW = 1800;
    if(w !== targetW){ h = Math.round(h*targetW/w); w = targetW; }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(source, 0, 0, w, h);
    const imgData = ctx.getImageData(0, 0, w, h);
    const d = imgData.data;
    let min=255, max=0;
    const gray = new Uint8ClampedArray(w*h);
    for(let i=0,p=0;i<d.length;i+=4,p++){
      const g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
      gray[p]=g; if(g<min) min=g; if(g>max) max=g;
    }
    const range = Math.max(1, max-min);
    for(let i=0,p=0;i<d.length;i+=4,p++){
      const v = Math.max(0, Math.min(255, ((gray[p]-min)/range)*255));
      d[i]=d[i+1]=d[i+2]=v;
    }
    ctx.putImageData(imgData, 0, 0);
    return await new Promise((resolve, reject)=>{
      canvas.toBlob((blob)=>{ blob ? resolve(blob) : reject(new Error('No se pudo procesar la imagen')); }, 'image/png');
    });
  } finally { close(); }
}
async function doAnalyze(){
  if(!STATE.scan.file) return;
  STATE.scan.stage='analyzing';
  STATE.scan.progress = 0;
  ocrCancelled = false;
  renderApp();
  try{
    await loadScriptOnce('tesseract');
  }catch(e){
    if(ocrCancelled) return;
    STATE.scan.stage='error';
    STATE.scan.error = 'No se pudo descargar el lector de texto. Hace falta conexión la primera vez que se usa; después funciona sin conexión. Comprueba tu red e inténtalo de nuevo.';
    renderApp();
    return;
  }
  if(ocrCancelled) return;
  let ocrInput = STATE.scan.file;
  try{ ocrInput = await preprocessForOcr(STATE.scan.file); }catch(e){ ocrInput = STATE.scan.file; }
  if(ocrCancelled) return;
  try{
    currentOcrWorker = await Tesseract.createWorker('spa', 1, {
      logger: m=>{
        if(m.status==='recognizing text' && typeof m.progress==='number'){
          const bar = document.getElementById('ocr-progress-bar');
          const pct = document.getElementById('ocr-progress-pct');
          if(bar) bar.style.width = Math.round(m.progress*100)+'%';
          if(pct) pct.textContent = Math.round(m.progress*100)+'%';
        }
      }
    });
    try{
      await currentOcrWorker.setParameters({
        tessedit_pageseg_mode: '4', // single column of text of variable sizes — matches a receipt strip
        preserve_interword_spaces: '1',
        // Phone photos carry no DPI metadata, so Tesseract falls back to assuming ~70 DPI —
        // far lower than our normalized 1800px-wide image actually is, which measurably hurts
        // character recognition (it's tuned/thresholds assume scanned-document resolutions).
        // Telling it the true approximate DPI for our fixed output width avoids that mismatch.
        user_defined_dpi: '300',
      });
    }catch(e){}
    const { data } = await currentOcrWorker.recognize(ocrInput);
    try{ await currentOcrWorker.terminate(); }catch(e){}
    currentOcrWorker = null;
    if(ocrCancelled) return;
    STATE.scan.result = parseReceiptText(data && data.text);
    STATE.scan.stage='review';
    renderApp();
  }catch(err){
    currentOcrWorker = null;
    if(ocrCancelled) return;
    STATE.scan.stage='error';
    STATE.scan.error = 'No se ha podido leer el ticket. Prueba con una foto más nítida y bien iluminada, o rellena los datos a mano.';
    renderApp();
  }
}
async function cancelAnalyze(){
  ocrCancelled = true;
  if(currentOcrWorker){ try{ await currentOcrWorker.terminate(); }catch(e){} currentOcrWorker=null; }
  STATE.scan.stage='photo';
  renderApp();
}
function recalcTotal(){
  const base = parseFloat(document.getElementById('f-base').value)||0;
  const tax = parseFloat(document.getElementById('f-tax').value)||0;
  document.getElementById('f-total').value = (base+tax).toFixed(2);
}
function doDeleteScanItem(idx){
  const r = STATE.scan.result;
  if(!r || !r.items || !r.items[idx]) return;
  const removed = r.items.splice(idx,1)[0];
  const price = Number(removed.precio_total)||0;
  // Se resta del valor que haya AHORA en el formulario (respeta si el usuario ya había ajustado
  // la base a mano antes de borrar la línea), no del valor original leído por el escáner.
  const baseInput = document.getElementById('f-base');
  const taxInput = document.getElementById('f-tax');
  const currentBase = baseInput ? (parseFloat(baseInput.value)||0) : Number(r.base_imponible||0);
  const currentTax = taxInput ? (parseFloat(taxInput.value)||0) : Number(r.impuesto||0);
  r.base_imponible = Math.max(0, +(currentBase - price).toFixed(2));
  r.impuesto = +currentTax.toFixed(2);
  r.total = +(r.base_imponible + r.impuesto).toFixed(2);
  renderApp();
  toast('Línea quitada — base y total actualizados');
}

function computeProductStats(list){
  const byProduct = new Map();
  const byCategoryProduct = new Map();
  for(const t of list){
    if(!t.items || !t.items.length) continue;
    const tagId = t.tag || 'otros';
    if(!byCategoryProduct.has(tagId)) byCategoryProduct.set(tagId, new Map());
    const catMap = byCategoryProduct.get(tagId);
    for(const it of t.items){
      const rawName = (it.nombre||'').trim();
      if(!rawName) continue;
      const key = rawName.toUpperCase();
      const price = Number(it.precio_total)||0;
      const qty = Number(it.cantidad)||1;
      let e = byProduct.get(key);
      if(!e){ e = {key, name:rawName, count:0, total:0}; byProduct.set(key,e); }
      e.count += qty; e.total += price;
      let ce = catMap.get(key);
      if(!ce){ ce = {key, name:rawName, count:0, total:0}; catMap.set(key,ce); }
      ce.count += qty; ce.total += price;
    }
  }
  const allByCount = Array.from(byProduct.values()).sort((a,b)=>b.count-a.count || b.total-a.total);
  const topByCount = allByCount.slice(0,6);
  const topBySpend = Array.from(byProduct.values()).sort((a,b)=>b.total-a.total).slice(0,6);
  const topPerCategory = [];
  for(const [tagId, catMap] of byCategoryProduct.entries()){
    const arr = Array.from(catMap.values()).sort((a,b)=>b.count-a.count || b.total-a.total);
    if(arr.length) topPerCategory.push({ tag: STATE.tags.find(x=>x.id===tagId), product: arr[0] });
  }
  topPerCategory.sort((a,b)=>b.product.total-a.product.total);
  return { topByCount, topBySpend, topPerCategory, allByCount, hasData: byProduct.size>0 };
}

    <div class="split-bar"><div style="flex:${Math.max(baseSum,0.0001)};background:var(--accent);"></div><div style="flex:${Math.max(taxSum,0.0001)};background:var(--tax);"></div></div>
    <div class="split-legend">
      <div class="item"><span class="swatch" style="background:var(--accent);"></span>Consumo ${money(baseSum)} (${basePct}%)</div>
      <div class="item"><span class="swatch" style="background:var(--tax);"></span>Impuestos ${money(taxSum)} (${taxPct}%)</div>
    </div></div>`;
  if(STATE.statsRange==='month') html += renderBudgetDetailCard(totalSum);

  const byTag = new Map();
  for(const t of list){ const k=t.tag||'otros'; byTag.set(k,(byTag.get(k)||0)+Number(t.total||0)); }
  const rows = Array.from(byTag.entries()).map(([tagId,val])=>({tag:STATE.tags.find(x=>x.id===tagId), val})).sort((a,b)=>b.val-a.val);
  const maxVal = rows.length ? rows[0].val : 1;
  html += `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><h2 style="margin-bottom:0;">Por categoría</h2><button class="btn btn-ghost btn-sm" data-action="stats-table-toggle" style="padding:0;">${STATE.statsTableView?'Ver gráfico':'Ver tabla'}</button></div>`;
  if(STATE.statsTableView){
    html += `<table class="stat-table"><thead><tr><th>Categoría</th><th class="num">Total</th><th class="num">%</th></tr></thead><tbody>`;
    for(const r of rows) html += `<tr><td>${r.tag?escapeHtml(r.tag.name):'Otros'}</td><td class="num">${money(r.val)}</td><td class="num">${totalSum?Math.round(r.val/totalSum*100):0}%</td></tr>`;
    html += `</tbody></table>`;
  } else {
    for(const r of rows){
      const pct = maxVal ? (r.val/maxVal*100) : 0;
      html += `<div class="bar-row"><div class="hd"><span class="name"><span class="tag-dot" style="background:${tagColor(r.tag)};width:9px;height:9px;"></span>${r.tag?escapeHtml(r.tag.name):'Otros'}</span><span class="num">${money(r.val)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${tagColor(r.tag)};"></div></div></div>`;
    }
  }
  html += `</div>`;

  const months = lastMonths(6);
  const monthTotals = months.map(m=>STATE.tickets.filter(t=>t.date&&t.date.slice(0,7)===m).reduce((s,t)=>s+Number(t.total||0),0));
  const maxM = Math.max(...monthTotals, 0.0001);
  html += `<div class="card"><h2>Tendencia (6 meses)</h2>
    <div class="trend-chart"><div class="trend-grid"><div style="bottom:0;"></div><div style="bottom:50%;"></div><div style="bottom:100%;"></div></div>
      ${months.map((m,i)=>`<div class="trend-col">
        <div class="trend-val num">${monthTotals[i]>0?Math.round(monthTotals[i]):''}</div>
        <div class="trend-bar" style="height:${Math.max(4,monthTotals[i]/maxM*100)}%;background:${m===STATE.currentMonth?'var(--accent)':'var(--cat-0)'};"></div>
        <div class="trend-lbl">${monthShort(m)}</div>
      </div>`).join('')}
    </div></div>`;

  const byMerchant = new Map();
  for(const t of list){
    const k=(t.merchant||'—').trim();
    let e = byMerchant.get(k);
    if(!e){ e = {visits:0, total:0}; byMerchant.set(k,e); }
    e.visits += 1; e.total += Number(t.total||0);
  }
  const topM = Array.from(byMerchant.entries()).sort((a,b)=>b[1].visits-a[1].visits || b[1].total-a[1].total).slice(0,5);
  const prodStats = computeProductStats(list);
  html += `<div class="day-label">Comercios y productos</div>`;
  if(topM.length){
    const maxMv = topM[0][1].visits||1;
    html += `<div class="card"><h2>Comercios más frecuentes</h2>`;
    for(const [name,e] of topM){
      html += `<div class="bar-row"><div class="hd"><span class="name">${escapeHtml(name)}</span><span class="num">${e.visits}× · ${money(e.total)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${e.visits/maxMv*100}%;background:var(--accent);"></div></div></div>`;
    }
    html += `</div>`;
  }

  // Las tres vistas de producto (más comprados / mayor gasto / por categoría) antes eran tres
  // tarjetas siempre visibles a la vez — se juntan en una sola con pestañas para que la pantalla
  // de Estadísticas no se vea como una pila interminable de tarjetas parecidas.
  if(prodStats.hasData){
    const view = STATE.statsProductView || 'count';
    html += `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
        <h2 style="margin-bottom:0;">Productos</h2>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn btn-sm ${view==='count'?'btn-primary':'btn-secondary'}" data-action="stats-product-view" data-view="count">Más comprados</button>
          <button class="btn btn-sm ${view==='spend'?'btn-primary':'btn-secondary'}" data-action="stats-product-view" data-view="spend">Mayor gasto</button>
          <button class="btn btn-sm ${view==='category'?'btn-primary':'btn-secondary'}" data-action="stats-product-view" data-view="category">Por categoría</button>
        </div>
      </div>`;
    if(view==='spend'){
      const maxSpend = prodStats.topBySpend[0] ? prodStats.topBySpend[0].total : 1;
      for(const p of prodStats.topBySpend){
        html += `<div class="bar-row"><div class="hd"><span class="name">${escapeHtml(p.name)}</span><span class="num">${money(p.total)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${(p.total/maxSpend*100)}%;background:var(--accent);"></div></div></div>`;
      }
    } else if(view==='category'){
      if(prodStats.topPerCategory.length){
        for(const row of prodStats.topPerCategory){
          html += `<div class="item-line"><span style="display:flex;align-items:center;gap:7px;"><span class="tag-dot" style="background:${tagColor(row.tag)};width:9px;height:9px;"></span>${row.tag?escapeHtml(row.tag.name):'Otros'}: ${escapeHtml(row.product.name)}</span><span class="num">${row.product.count}×</span></div>`;
        }
      } else {
        html += `<p style="font-size:12.5px;color:var(--muted);margin:0;">Todavía no hay suficientes categorías con productos detectados.</p>`;
      }
    } else {
      const maxCount = prodStats.topByCount[0] ? prodStats.topByCount[0].count : 1;
      for(const p of prodStats.topByCount){
        html += `<div class="bar-row"><div class="hd"><span class="name">${escapeHtml(p.name)}</span><span class="num">${p.count}×</span></div><div class="bar-track"><div class="bar-fill" style="width:${(p.count/maxCount*100)}%;background:var(--accent);"></div></div></div>`;
      }
    }
    html += `</div>`;
  } else {
    html += `<div class="notice" style="margin-top:4px;"><span class="msy sm">info</span>Cuando la lectura automática detecte los productos de tus tickets, aquí verás cuáles compras más y en qué gastas más.</div>`;
  }
  return html;
}

function downloadBlob(filename, content, mime){
  const blob = (content instanceof Blob) ? content : new Blob([content], {type: mime||'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ try{ document.body.removeChild(a); }catch(e){} URL.revokeObjectURL(url); }, 200);
}

async function doExportPdf(){
  if(!STATE.tickets.length){ toast('No hay tickets para exportar'); return; }
  const btn = document.querySelector('[data-action="export-pdf"]');
  const originalHtml = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Generando PDF...'; }
  try{
    await loadScriptOnce('jspdf');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:'a4' });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const marginX = 42;
    let y = 56;

    const tickets = STATE.tickets.slice().sort((a,b)=>a.date.localeCompare(b.date));
    const first = tickets[0].date, last = tickets[tickets.length-1].date;
    const totalGasto = tickets.reduce((s,t)=>s+Number(t.total||0),0);
    const totalBase = tickets.reduce((s,t)=>s+Number(t.subtotal||0),0);
    const totalImpuesto = tickets.reduce((s,t)=>s+Number(t.taxAmount||0),0);

    function ensureSpace(h){ if(y+h > pageH-48){ doc.addPage(); y = 56; return true; } return false; }
    function heading(text, size){
      size = size||13;
      ensureSpace(size+14);
      doc.setFont('helvetica','bold'); doc.setFontSize(size); doc.setTextColor(20,20,20);
      doc.text(text, marginX, y);
      y += size+10;
    }
    function line(text, opts){
      opts = opts||{};
      const size = opts.size||10;
      ensureSpace(size+6);
      doc.setFont('helvetica', opts.bold?'bold':'normal'); doc.setFontSize(size);
      doc.setTextColor.apply(doc, opts.color||[60,60,60]);
      doc.text(text, marginX + (opts.indent||0), y);
      y += size+6;
    }

    doc.setFont('helvetica','bold'); doc.setFontSize(19); doc.setTextColor(20,20,20);
    doc.text('Tiquetario', marginX, y); y+=22;
    doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(90,90,90);
    doc.text('Resumen de gastos', marginX, y); y += 16;
    doc.setFontSize(9.5); doc.setTextColor(130,130,130);
    doc.text('Generado el '+new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'}), marginX, y); y += 22;

    doc.setDrawColor(220,220,220); doc.line(marginX, y, pageW-marginX, y); y += 20;

    heading('Resumen del período');
    line('Período: '+first+' a '+last);
    line('Tickets registrados: '+tickets.length);
    line('Total gastado: '+money(totalGasto), {bold:true, size:12, color:[20,20,20]});
    line('Base imponible: '+money(totalBase));
    line('Impuesto total: '+money(totalImpuesto));
    y += 8;

    heading('Gasto por categoría');
    const byTag = new Map();
    for(const t of tickets){
      const key = t.tag || '_none';
      byTag.set(key, (byTag.get(key)||0) + Number(t.total||0));
    }
    const tagRows = Array.from(byTag.entries()).map(([tagId, total])=>{
      const tag = STATE.tags.find(x=>x.id===tagId);
      return { name: tag?tag.name:'Sin categoría', total, hex: catHex(tag) };
    }).sort((a,b)=>b.total-a.total);
    const maxCat = Math.max(1, ...tagRows.map(r=>r.total));
    const barMaxW = pageW - marginX*2 - 160;
    for(const r of tagRows){
      ensureSpace(18);
      const barW = Math.max(2, (r.total/maxCat)*barMaxW);
      const rgb = [parseInt(r.hex.slice(1,3),16), parseInt(r.hex.slice(3,5),16), parseInt(r.hex.slice(5,7),16)];
      doc.setFillColor(rgb[0],rgb[1],rgb[2]);
      doc.rect(marginX, y-9, barW, 9, 'F');
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(60,60,60);
      doc.text(r.name, marginX + barMaxW + 10, y-2);
      doc.setFont('helvetica','bold');
      doc.text(money(r.total), pageW-marginX, y-2, {align:'right'});
      y += 16;
    }
    y += 10;

    heading('Comercios más frecuentes');
    const byMerchant = new Map();
    for(const t of tickets){
      const key = (t.merchant||'').trim() || 'Sin nombre';
      const cur = byMerchant.get(key) || { count:0, total:0 };
      cur.count++; cur.total += Number(t.total||0);
      byMerchant.set(key, cur);
    }
    const merchantRows = Array.from(byMerchant.entries()).map(([name,v])=>Object.assign({name}, v)).sort((a,b)=>b.total-a.total).slice(0,8);
    for(const m of merchantRows){
      line(m.name+'  —  '+m.count+' ticket'+(m.count===1?'':'s')+'  —  '+money(m.total));
    }
    y += 10;

    heading('Detalle de tickets');
    const cols = [
      { key:'date', label:'Fecha', w:56 },
      { key:'merchant', label:'Comercio', w:150 },
      { key:'tag', label:'Categoría', w:100 },
      { key:'total', label:'Total', w:70, align:'right' },
    ];
    function tableHeader(){
      ensureSpace(20);
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(255,255,255);
      doc.setFillColor(40,40,40);
      doc.rect(marginX, y-11, pageW-marginX*2, 16, 'F');
      let x = marginX+6;
      for(const c of cols){ doc.text(c.label, c.align==='right'? x+c.w-6 : x, y, c.align==='right'?{align:'right'}:{}); x+=c.w; }
      y += 12;
    }
    tableHeader();
    let rowIndex = 0;
    for(const t of tickets){
      const broke = ensureSpace(16);
      if(broke){ tableHeader(); }
      if(rowIndex%2===0){ doc.setFillColor(247,247,245); doc.rect(marginX, y-9, pageW-marginX*2, 14, 'F'); }
      const tag = STATE.tags.find(x=>x.id===t.tag);
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(40,40,40);
      let x = marginX+6;
      doc.text(t.date, x, y); x+=cols[0].w;
      doc.text((t.merchant||'').slice(0,28), x, y); x+=cols[1].w;
      doc.text((tag?tag.name:'Otros').slice(0,18), x, y); x+=cols[2].w;
      doc.text(money(t.total), x+cols[3].w-6, y, {align:'right'});
      y += 14;
      rowIndex++;
    }

    doc.save('tiquetario-resumen-'+todayStr()+'.pdf');
    toast('PDF descargado');
  }catch(e){
    toast('No se pudo generar el PDF');
  }finally{
    if(btn){ btn.disabled=false; btn.innerHTML = originalHtml || '<span class="msy sm">picture_as_pdf</span>Descargar resumen en PDF'; }
  }
}
function prepareDeleteOld(){
  const amountInput = document.getElementById('old-amount');
  const unitInput = document.getElementById('old-unit');
  if(!amountInput || !unitInput) return;
  const amount = parseInt(amountInput.value, 10);
  const unit = unitInput.value;
  if(!amount || amount<1){ toast('Indica una antigüedad válida'); return; }
  const cutoff = computeCutoffDate(amount, unit);
  const matches = STATE.tickets.filter(t=>t.date < cutoff);
  if(!matches.length){ toast('No hay tickets más antiguos que eso'); return; }
  const unitLabel = unit==='days'?'días':(unit==='years'?'años':'meses');
  STATE.pendingConfirm = { action:'delete-old', payload: { cutoff } };
  openConfirm('Eliminar tickets antiguos', 'Se eliminarán '+matches.length+' ticket'+(matches.length===1?'':'s')+' anteriores al '+cutoff+' (más de '+amount+' '+unitLabel+'). Esta acción no se puede deshacer.', true);
}

function findDuplicate(c){
  const t = new Date(c.date+'T00:00:00').getTime();
  return STATE.tickets.find(x=> x.merchant.trim().toLowerCase()===c.merchant.trim().toLowerCase() && Math.abs(Number(x.total)-Number(c.total))<0.01 && Math.abs(new Date(x.date+'T00:00:00').getTime()-t) <= 3*86400000);
}
async function compressImage(file, maxW=1000, quality=0.72){
  const { source, w: ow, h: oh, close } = await loadOrientedImage(file);
  try{
    let w=ow||1, h=oh||1;
    if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
    const canvas = document.createElement('canvas');
    canvas.width=w; canvas.height=h;
    canvas.getContext('2d').drawImage(source,0,0,w,h);
    return canvas.toDataURL('image/jpeg', quality);
  } finally { close(); }
}
async function commitTicket(candidate){

  STATE.tickets.unshift(ticket);

  toast('Ticket guardado');
}
async function doSaveTicket(){
  const merchant = document.getElementById('f-merchant').value.trim() || 'Comercio';
  const date = document.getElementById('f-date').value || todayStr();
  const tag = document.getElementById('f-tag').value;
  const subtotal = parseFloat(document.getElementById('f-base').value)||0;
  const taxAmount = parseFloat(document.getElementById('f-tax').value)||0;
  const taxRateRaw = document.getElementById('f-taxrate').value;
  const taxRate = taxRateRaw===''? null : parseFloat(taxRateRaw);
  const total = parseFloat(document.getElementById('f-total').value)||0;
  const notes = document.getElementById('f-notes').value.trim();
  const items = (STATE.scan.result && STATE.scan.result.items) || [];
  const candidate = { merchant, date, tag, subtotal, taxAmount, taxRate, total, notes, items };
  const dup = findDuplicate(candidate);
  if(dup){
    STATE.pendingConfirm = { action:'save-duplicate', payload: candidate };
    openConfirm('Posible duplicado', `Ya existe un ticket de ${escapeHtml(dup.merchant)} por ${money(dup.total)} el ${dup.date}. ¿Guardar también este?`, false);
    return;
  }
  await commitTicket(candidate);
}
function openTicketDetail(id){
  const t = STATE.tickets.find(x=>x.id===id);
  if(!t) return;
  const tagsOpts = STATE.tags.map(tag=>`<option value="${tag.id}" ${t.tag===tag.id?'selected':''}>${escapeHtml(tag.name)}</option>`).join('');
  const itemsBlock = (t.items && t.items.length) ? `
    <details class="items-details" open>
      <summary>Ver desglose de productos (${t.items.length})</summary>
      <div class="items-details-list">${t.items.map((it,idx)=>`<div class="item-line"><span>${escapeHtml(it.nombre||'—')}${it.cantidad&&it.cantidad!==1?` ×${it.cantidad}`:''}</span><span style="display:flex;align-items:center;gap:2px;"><span class="num">${money(it.precio_total||0)}</span><button class="icon-btn" style="padding:4px;" data-action="delete-ticket-item" data-id="${t.id}" data-idx="${idx}" title="Quitar producto (lectura incorrecta)"><span class="msy sm">close</span></button></span></div>`).join('')}</div>
      <p style="font-size:11.5px;color:var(--muted);margin:2px 0 8px;">Si el lector leyó mal algún producto, quítalo con la ✕ — no afecta a la base, el impuesto ni el total del ticket.</p>
    </details>` : '';
  const body = `
    ${t.photo?`<img class="photo-full" src="${t.photo}" alt="Foto del ticket">`:''}
    ${itemsBlock}
    <div class="field"><label for="d-merchant">Comercio</label><input id="d-merchant" value="${escapeHtml(t.merchant||'')}"></div>
    <div class="row">
      <div class="field"><label for="d-date">Fecha</label><input type="date" id="d-date" value="${t.date}"></div>
      <div class="field"><label for="d-tag">Categoría</label><select id="d-tag">${tagsOpts}</select></div>
    </div>
    <div class="row">
      <div class="field"><label for="d-base">Base imponible (€)</label><input type="number" step="0.01" id="d-base" value="${fixed2(t.subtotal)}"></div>
      <div class="field"><label for="d-tax">Impuesto (€)</label><input type="number" step="0.01" id="d-tax" value="${fixed2(t.taxAmount)}"></div>
    </div>
    <div class="field"><label for="d-total">Total (€)</label><input type="number" step="0.01" id="d-total" value="${fixed2(t.total)}"></div>
    <div class="field"><label for="d-notes">Notas</label><textarea id="d-notes" rows="2">${escapeHtml(t.notes||'')}</textarea></div>
    <div class="btn-stack">
      <button class="btn btn-primary" data-action="update-ticket" data-id="${t.id}">Guardar cambios</button>
      <button class="btn btn-danger" data-action="delete-ticket" data-id="${t.id}">Eliminar ticket</button>
    </div>`;
  openModal('Detalle del ticket', body);
}
async function doUpdateTicket(id){
  const t = STATE.tickets.find(x=>x.id===id);
  if(!t) return;
  t.merchant = document.getElementById('d-merchant').value.trim()||'Comercio';
  t.date = document.getElementById('d-date').value || t.date;
  t.tag = document.getElementById('d-tag').value;
  t.subtotal = parseFloat(document.getElementById('d-base').value)||0;
  t.taxAmount = parseFloat(document.getElementById('d-tax').value)||0;
  t.total = parseFloat(document.getElementById('d-total').value)||0;
  t.notes = document.getElementById('d-notes').value.trim();
  try{ await idbPut('tickets', t); }catch(e){ toast('No se pudo guardar'); return; }
  closeModal(); renderApp(); toast('Cambios guardados');
}
async function doDeleteTicketItem(id, idx){
  const t = STATE.tickets.find(x=>x.id===id);
  if(!t || !t.items || !t.items[idx]) return;
  t.items.splice(idx,1);
  try{ await idbPut('tickets', t); }catch(e){ toast('No se pudo guardar'); return; }
  openTicketDetail(id);
  toast('Producto quitado del desglose');
}

/* ================= Modal / Toast ================= */
function openModal(title, bodyHtml){
  document.getElementById('modal-root').innerHTML = `<div class="modal-backdrop" data-action="modal-backdrop">
    <div class="modal-sheet"><div class="modal-head"><h2>${title}</h2><button class="icon-btn" data-action="close-modal"><span class="msy">close</span></button></div>${bodyHtml}</div>
  </div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; STATE.pendingConfirm=null; }
function openConfirm(title, message, danger){
  const body = `<p style="font-size:14.5px;color:var(--ink-2);margin-bottom:18px;">${message}</p>
    <div class="btn-stack">
      <button class="btn ${danger?'btn-danger':'btn-primary'}" data-action="confirm-yes">Sí, continuar</button>
      <button class="btn btn-secondary" data-action="confirm-no">Cancelar</button>
    </div>`;
  openModal(title, body);
}
let toastTimer=null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.hidden = true; }, 2600);
}
async function runPendingConfirm(){
  const pc = STATE.pendingConfirm;
  if(!pc) return closeModal();
  if(pc.action==='delete-ticket'){
    try{ await idbDelete('tickets', pc.id); }catch(e){}
    STATE.tickets = STATE.tickets.filter(t=>t.id!==pc.id);
    closeModal(); renderApp(); toast('Ticket eliminado');
  } else if(pc.action==='save-duplicate'){
    closeModal();
    await commitTicket(pc.payload);
  } else if(pc.action==='delete-tag'){
    const fallback = STATE.tags.find(t=>t.id==='otros' && t.id!==pc.id) ? 'otros' : null;
    STATE.tags = STATE.tags.filter(t=>t.id!==pc.id);
    try{ await idbDelete('tags', pc.id); }catch(e){}
    for(const t of STATE.tickets){ if(t.tag===pc.id){ t.tag=fallback; try{ await idbPut('tickets', t); }catch(e){} } }
    closeModal(); renderApp(); toast('Etiqueta eliminada');
  } else if(pc.action==='clear-data'){
    try{
      for(const t of STATE.tickets) await idbDelete('tickets', t.id);
      for(const t of STATE.tags) await idbDelete('tags', t.id);
      await idbDelete('meta','budget');
    }catch(e){}
    STATE.tickets = [];
    STATE.tags = DEFAULT_TAGS.map(t=>({...t}));
    for(const t of STATE.tags){ try{ await idbPut('tags', t); }catch(e){} }
    STATE.budget = 0;
    closeModal(); renderApp(); toast('Datos borrados');
  } else if(pc.action==='delete-old'){
    const cutoff = pc.payload.cutoff;
    const toDelete = STATE.tickets.filter(t=>t.date < cutoff);
    try{ for(const t of toDelete){ await idbDelete('tickets', t.id); } }catch(e){}
    STATE.tickets = STATE.tickets.filter(t=>t.date >= cutoff);
    closeModal(); renderApp(); toast(toDelete.length+' ticket'+(toDelete.length===1?'':'s')+' eliminado'+(toDelete.length===1?'':'s'));
  }
  STATE.pendingConfirm = null;
}

/* ================= Event delegation ================= */
document.addEventListener('click', async (e)=>{
  if(e.target.classList && e.target.classList.contains('modal-backdrop')){ closeModal(); return; }
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  switch(action){
    case 'tab': STATE.view = btn.dataset.view; renderApp(); break;
    case 'prev-month': STATE.currentMonth = shiftMonth(STATE.currentMonth,-1); renderApp(); break;
    case 'next-month': STATE.currentMonth = shiftMonth(STATE.currentMonth,1); renderApp(); break;
    case 'filter-tag': STATE.ticketFilter.tag = id || null; renderApp(); break;
    case 'open-ticket': openTicketDetail(id); break;
    case 'close-modal': case 'confirm-no': closeModal(); break;
    case 'update-ticket': await doUpdateTicket(id); break;
    case 'delete-ticket-item': await doDeleteTicketItem(id, Number(btn.dataset.idx)); break;
    case 'delete-ticket': STATE.pendingConfirm={action:'delete-ticket', id}; openConfirm('Eliminar ticket','Esta acción no se puede deshacer. ¿Eliminar este ticket?', true); break;
    case 'confirm-yes': await runPendingConfirm(); break;
    case 'pick-camera': document.getElementById('file-camera').click(); break;
    case 'pick-gallery': document.getElementById('file-gallery').click(); break;
    case 'manual-entry': startManualEntry(false); break;
    case 'manual-entry-photo': startManualEntry(true); break;
    case 'retake': resetScan(); renderApp(); break;
    case 'analyze': await doAnalyze(); break;
    case 'cancel-analyze': await cancelAnalyze(); break;
    case 'recalc-total': recalcTotal(); break;
    case 'delete-scan-item': doDeleteScanItem(Number(btn.dataset.idx)); break;
    case 'save-ticket': await doSaveTicket(); break;
    case 'discard-scan': resetScan(); renderApp(); break;
    case 'stats-range': STATE.statsRange = btn.dataset.range; STATE.statsFilter = { product:null, merchant:null }; renderApp(); break;
    case 'stats-table-toggle': STATE.statsTableView = !STATE.statsTableView; renderApp(); break;
    case 'stats-product-view': STATE.statsProductView = btn.dataset.view; renderApp(); break;
    case 'stats-filter-clear': STATE.statsFilter = { product:null, merchant:null }; renderApp(); break;
    case 'add-tag': openTagForm(null); break;
    case 'edit-tag': openTagForm(id); break;
    case 'delete-tag': STATE.pendingConfirm={action:'delete-tag', id}; openConfirm('Eliminar etiqueta','Los tickets con esta etiqueta pasarán a "Otros". ¿Eliminar?', true); break;
    case 'save-tag': await doSaveTag(); break;
    case 'set-theme': await setTheme(btn.dataset.theme); break;
    case 'save-budget': await doSaveBudget(); break;
    case 'export-csv': await doExportCsv(); break;
    case 'export-pdf': await doExportPdf(); break;
    case 'delete-old': prepareDeleteOld(); break;
    case 'clear-data': STATE.pendingConfirm={action:'clear-data'}; openConfirm('Borrar todos los datos','Se eliminarán todos los tickets, fotos y etiquetas personalizadas de este dispositivo. Esta acción no se puede deshacer.', true); break;
  }
});

boot();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
